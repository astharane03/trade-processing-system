version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
      POSTGRES_DB: tradingdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d tradingdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: trading-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --overprovisioned
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.4.3
    container_name: trading-redpanda-console
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: redpandadata/redpanda:v23.3.11
    container_name: trading-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      rpk topic create orders.placed       --brokers redpanda:29092 --partitions 3 --replicas 1
      rpk topic create trades.executed     --brokers redpanda:29092 --partitions 3 --replicas 1
      rpk topic create portfolio.updates   --brokers redpanda:29092 --partitions 3 --replicas 1
      rpk topic create risk.alerts         --brokers redpanda:29092 --partitions 3 --replicas 1
      rpk topic create portfolio.updates.dlq --brokers redpanda:29092 --partitions 1 --replicas 1
      rpk topic create orders.placed.dlq   --brokers redpanda:29092 --partitions 1 --replicas 1
      rpk topic create trades.executed.dlq --brokers redpanda:29092 --partitions 1 --replicas 1
      echo 'All topics created.'
      "

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: trading-order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradingdb
      SPRING_DATASOURCE_USERNAME: trader
      SPRING_DATASOURCE_PASSWORD: trader123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  portfolio-service:
    build:
      context: .
      dockerfile: portfolio-service/Dockerfile
    container_name: trading-portfolio-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradingdb
      SPRING_DATASOURCE_USERNAME: trader
      SPRING_DATASOURCE_PASSWORD: trader123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    container_name: trading-risk-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8082
    depends_on:
      redpanda:
        condition: service_healthy

  notifier-service:
    build:
      context: .
      dockerfile: notifier-service/Dockerfile
    container_name: trading-notifier-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8083
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  redpanda-data: